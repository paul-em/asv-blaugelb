<!--
  Reduzierte Variante der Vereinsmarke für sehr kleine Größen (16–24 px).
  Beide Sicheln in Gelb und deutlich breiter gezeichnet (innerer Radius 70
  statt 96), damit die Bahn im Browser-Tab nicht zuläuft.
  Größere Darstellungen: app/components/LogoMark.vue
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="11" fill="#0b4f9e"/>
  <g transform="translate(24 24) rotate(-23) scale(0.105)">
    <path fill="#ffd11a" d="M0,-56 A150,56 0 0 0 0,56 A70,56 0 0 1 0,-56 Z"/>
    <path fill="#ffd11a" d="M0,-56 A150,56 0 0 1 0,56 A70,56 0 0 0 0,-56 Z"/>
  </g>
</svg>
